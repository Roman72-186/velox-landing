server {
    listen 80;
    listen [::]:80;
    server_name queenofspades.tech www.queenofspades.tech;

    # Оставляем доступным ACME-challenge для Let's Encrypt без редиректа
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name queenofspades.tech www.queenofspades.tech;

    ssl_certificate /etc/letsencrypt/live/queenofspades.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/queenofspades.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/queenofspades.tech;
    index index.html;
    error_page 404 /404.html;

    # Скрываем скрытые/служебные файлы и каталоги от внешнего доступа
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~ ^/(deploy|node_modules|server\.js|package(-lock)?\.json|\.env.*)$ {
        deny all;
    }

    # API формы → локальный Node-сервис на 127.0.0.1:3001
    location = /api/contact {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /404.html {
        internal;
    }

    # Длинный кэш для версионируемых ассетов (CSS/JS грузятся с ?v=N)
    location ~* \.(?:css|js|woff2?|ttf|otf|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
